apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-three
  namespace: inception-of-things
  labels:
    app: app-three
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-three
  template:
    metadata:
      labels:
        app: app-three
    spec:
      containers:
        - name: hello-kubernetes
          image: "paulbouwer/hello-kubernetes:1.10.1"
          env:
          - name: MESSAGE
            value: "Hello from app3."
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: app-three-service
  namespace: inception-of-things
spec:
  type: ClusterIP
  selector:
    app: app-three
  ports:
  - port: 80
    targetPort: 8080
